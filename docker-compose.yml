services:
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: cida_backend
    ports:
      - "8000:8000"
    volumes:
      - ./BackEnd:/app
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./BackEnd/.env

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: cida_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
    depends_on:
      - backend